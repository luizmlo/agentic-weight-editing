[project]
name = "agentic-weight-editing"
version = "0.1.0"
description = "Frontier-model agents as weight-space programmers: rank-1 edits that fix a behavioral defect (reasoning loops) in Qwen3.5-0.8B"
readme = "README.md"
requires-python = ">=3.12"
# Pinned to the exact versions every reported number was produced with.
dependencies = [
    "torch==2.14.1",
    "transformers==5.22.1",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "safetensors==0.8.0",
    "huggingface-hub==2.4.0",
    "datasets==5.1.0",
    "flash-linear-attention==0.6.0",  # Triton kernels for Qwen3.5's Gated DeltaNet layers (works on sm_75)
    "httpx==0.28.1",
    "numpy==2.5.4",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "wsp"
